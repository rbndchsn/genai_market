<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — GenAI Market</title>
<meta name="description" content="The page you asked for does not exist.">
<script>
/* GitHub Pages serves this file for any missing path under the project, so relative URLs would break
   for nested paths. On github.io, anchor everything to the project root (first path segment). */
(function(){if(/\.github\.io$/.test(location.hostname)){var seg=location.pathname.split("/")[1]||"";var b=document.createElement("base");b.href="/"+(seg?seg+"/":"");document.head.appendChild(b);}})();
</script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/site.css">
<script>
/* Apply a stored theme before first paint to avoid a flash. */
(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
</head>
<body data-page="">
<main id="main" class="container">
<h1>Page not found</h1>
<p class="lead">That page does not exist. Try the navigation above, <a href="search.html">search the site</a>, or go back to the <a href="index.html">overview</a>.</p>
</main>
<script src="js/shell.js"></script>
</body>
</html>
