<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistics — GenAI Market</title>
<meta name="description" content="Survey statistics on enterprise AI adoption, agents, spend, governance and talent, rebuilt as charts from our own data with sample sizes and sources.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/site.css">
<script>
/* Apply a stored theme before first paint to avoid a flash. */
(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
</head>
<body data-page="stats">
<script src="js/shell.js"></script>
<main id="main" class="container">
<h1>Statistics</h1>
<p class="lead">Every number we drew on, rebuilt as a chart from our own data file rather than copied from a source. Each one carries its sample, caveats and reference, and a data table sits behind every chart.</p>
<div id="filters" class="filters" role="search" aria-label="Filter statistics"></div>
<p id="count" class="muted count-line" aria-live="polite"></p>
<div id="results"></div>
<div id="tooltip" class="viz-tooltip viz-tooltip-fixed" hidden role="status"></div>
</main>
<script src="js/stats.js"></script>
</body>
</html>
