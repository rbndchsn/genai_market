<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — GenAI Market</title>
<meta name="description" content="Search the GenAI Market meta-analysis: insights, statistics, vendors, glossary terms, taxonomy and sources.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/site.css">
<script>
/* Apply a stored theme before first paint to avoid a flash. */
(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
</head>
<body data-page="search">
<main id="main" class="container">
<h1>Search</h1>
<p class="lead">Search every insight, statistic, vendor profile, glossary term, taxonomy entry and source on the site. Results link straight to the record.</p>
<form id="search-form" class="search-form" role="search" action="search.html" method="get">
  <label for="q" class="visually-hidden">Search the site</label>
  <input id="q" name="q" type="search" placeholder="Try: agent governance, token costs, POC to production" autocomplete="off" autofocus>
  <button type="submit" class="button-primary">Search</button>
</form>
<div id="type-filter" class="pills type-filter" aria-label="Filter by record type"></div>
<p id="count" class="muted count-line" aria-live="polite"></p>
<div id="results" class="stack"></div>
<div id="starters"></div>
</main>
<script src="js/shell.js"></script>
<script src="js/search.js"></script>
</body>
</html>
